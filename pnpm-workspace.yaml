allowBuilds:
  esbuild: true
  sharp: true
blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-*"
  - astro
  - nanoid
  - vite-plus
trustPolicy: no-downgrade
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
overrides:
  js-yaml: 4.3.1
  nanoid: 3.3.17
  postcss: 8.5.23
  svgo: 4.0.2
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
